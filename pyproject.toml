[project]
name = "rated-mcp"
version = "0.1.0"
description = "Local MCP server (stdio) wrapping the Rated API, generated from Rated's OpenAPI spec."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
]

[project.scripts]
rated-mcp = "rated_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "jsonschema>=4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rated_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
